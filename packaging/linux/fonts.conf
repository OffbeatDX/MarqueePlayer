<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The AppImage's fontconfig configuration (AppRun sets FONTCONFIG_FILE to it): the system's
     own configuration, then the fonts inside the AppImage as a fallback, found relative to
     this file (usr/share/marquee-player/ -> usr/share/fonts/marquee-player/). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../fonts/marquee-player</dir>
</fontconfig>
