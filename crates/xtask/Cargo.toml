[package]
name = "xtask"
description = "The development commands, `cargo xtask build|check|bench|release` (development only; never shipped)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Standard library only, so it compiles in seconds on any system, but for serde_json, which
# `release` needs to read `cargo metadata` for the third-party notices (already in the
# workspace; a few seconds more).
[dependencies]
serde_json = { workspace = true }
